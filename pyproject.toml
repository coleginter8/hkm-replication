[project]
name = "hkm-replication"
version = "0.0.1"
description = "Intermediary Asset Pricing: HKM (2017) replication"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "sqlalchemy",
    "psycopg2-binary",
    "pandas-datareader",
    "requests",
    "statsmodels",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "mypy>=1.5", "ruff>=0.1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.10"
