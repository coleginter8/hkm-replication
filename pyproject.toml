[project]
name = "hkm-replication"
version = "0.0.1"
description = "Intermediary Asset Pricing: HKM (2017) replication"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "sqlalchemy",
    "psycopg2-binary",
    "pandas-datareader",
    "requests",
    "statsmodels",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "mypy>=1.5", "ruff>=0.1"]
